services:
  # ============ 基础设施 ============
  mysql:
    image: mysql:8.0
    container_name: sc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: supply_chain
      MYSQL_USER: scuser
      MYSQL_PASSWORD: sc123456
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sc-net]

  redis:
    image: redis:7-alpine
    container_name: sc-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sc-net]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: sc-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      JVM_XMS: 256m
      JVM_XMX: 512m
      PREFER_HOST_MODE: hostname
    ports:
      - "18848:8848"
      - "19848:9848"
      - "19849:9849"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8848/nacos/v1/console/health/liveness",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sc-net]

  # ============ AI 分析服务 (Python) ============
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sc-ai
    restart: unless-stopped
    ports:
      - "18086:8086"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=scuser
      - DB_PASSWORD=sc123456
      - DB_NAME=supply_chain
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [sc-net]

  # ============ Java 微服务 ============
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_MODULE: gateway
    container_name: sc-gateway
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
      - JWT_SECRET=SupplyChainSecretKey2026ForGraduationProject!!
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [sc-net]

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_MODULE: user-service
    container_name: sc-user
    restart: unless-stopped
    ports:
      - "18081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
      - JWT_SECRET=SupplyChainSecretKey2026ForGraduationProject!!
    depends_on:
      - mysql
      - redis
      - nacos
      - gateway
    networks: [sc-net]

  product-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_MODULE: product-service
    container_name: sc-product
    restart: unless-stopped
    ports:
      - "18082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
    depends_on:
      - mysql
      - redis
      - nacos
      - gateway
    networks: [sc-net]

  purchase-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_MODULE: purchase-service
    container_name: sc-purchase
    restart: unless-stopped
    ports:
      - "18083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8084
    depends_on:
      - mysql
      - redis
      - nacos
      - product-service
      - inventory-service
    networks: [sc-net]

  inventory-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_MODULE: inventory-service
    container_name: sc-inventory
    restart: unless-stopped
    ports:
      - "18084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
    depends_on:
      - mysql
      - redis
      - nacos
      - gateway
    networks: [sc-net]

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_MODULE: order-service
    container_name: sc-order
    restart: unless-stopped
    ports:
      - "18085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
      - INVENTORY_SERVICE_URL=http://inventory-service:8084
      - AI_SERVICE_URL=http://ai-service:8086
    depends_on:
      - mysql
      - redis
      - nacos
      - inventory-service
      - ai-service
    networks: [sc-net]

  # ============ 前端 ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sc-frontend
    restart: unless-stopped
    ports:
      - "18088:80"
    depends_on:
      - gateway
    networks: [sc-net]

volumes:
  mysql-data:
  redis-data:

networks:
  sc-net:
    driver: bridge
