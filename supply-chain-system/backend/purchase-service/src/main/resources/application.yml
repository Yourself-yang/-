server:
  port: 8083

spring:
  application:
    name: purchase-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    name: supply_chain
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/supply_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: scuser
    password: sc123456
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

service-urls:
  product: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory: ${INVENTORY_SERVICE_URL:http://localhost:8084}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

logging:
  level:
    com.supplychain: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
