server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/suppliers/**
        - id: purchase-service
          uri: lb://purchase-service
          predicates:
            - Path=/api/v1/purchase/**,/api/v1/purchase-orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: ai-service
          uri: http://ai-service:8086
          predicates:
            - Path=/api/v1/ai/**
      globalcors:
        add-to-simple-url-handler-mapping: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  secret: ${JWT_SECRET:SupplyChainSecretKey2026ForGraduationProject!!}

logging:
  level:
    org.springframework.cloud.gateway: INFO
